name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r-version: release
          - os: macos-latest
            r-version: release
          - os: windows-latest
            r-version: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      - name: Build source package
        run: R CMD build .
        shell: bash
      - name: Check package
        run: |
          R CMD check --no-manual --as-cran kpqc_*.tar.gz
          grep -q '^Status: OK$' kpqc.Rcheck/00check.log
        shell: bash
      - name: Check native symbol visibility
        if: runner.os == 'Linux'
        run: |
          test "$(nm -D --defined-only kpqc.Rcheck/kpqc/libs/kpqc.so | awk '{print $3}')" = "R_init_kpqc"
        shell: bash

  minimum-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check with R 3.6.3
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            rocker/r-ver:3.6.3 \
            bash -lc 'R CMD build . && R CMD check --no-manual kpqc_*.tar.gz && grep -q "^Status: OK$" kpqc.Rcheck/00check.log'

  known-answer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KpqC/kpqc-test-vectors
          ref: 179dcc05ece2e22262cea1a61f3cdf1a5b08a304
          path: kpqc-test-vectors
      - uses: r-lib/actions/setup-r@v2
      - name: Build source package
        run: R CMD build .
      - name: Validate known-answer tests
        env:
          KPQC_CPPFLAGS: -DKPQC_TEST_ENTROPY
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: |
          R CMD check --no-manual kpqc_*.tar.gz
          grep -q '^Status: OK$' kpqc.Rcheck/00check.log
